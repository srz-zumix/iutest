name: 'Test Report'
description: 'test report'
inputs:
  report_paths:
    description: 'test report path'
    required: true
  token:
    description: 'github token'
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Test Report
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: "${{ inputs.report_paths }}"
        token: ${{ inputs.token }}
        annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      if: ${{ env.CPP_ACTIONS != 'true' }}
    - name: Test Summary
      uses: test-summary/action@v2
      with:
        paths: "${{ inputs.report_paths }}"
      if: ${{ env.CPP_ACTIONS != 'true' }}
