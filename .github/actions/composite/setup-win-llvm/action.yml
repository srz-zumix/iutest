name: 'Setup Window LLVM'
description: 'setup windows llvm'

runs:
  using: "composite"
  steps:
    - name: choco-upgrade
      shell: cmd
      run: |
        choco upgrade -y llvm || exit 1
    - name: set path
      shell: bash
      run: |
        printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
