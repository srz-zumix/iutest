name: 'Setup Window LLVM'
description: 'setup windows llvm'

runs:
  using: "composite"
  steps:
    - name: install LLVM
      shell: pwsh
      run: |
        $llvmVersion = "23.1.6"
        $installer = Join-Path $env:RUNNER_TEMP "LLVM-$llvmVersion-win64.msi"
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.msi"
        Invoke-WebRequest -Uri $url -OutFile $installer
        $process = Start-Process -FilePath msiexec.exe -ArgumentList @("/i", $installer, "/qn", "/norestart") -Wait -PassThru
        if ($process.ExitCode -ne 0) {
          exit $process.ExitCode
        }
    - name: set path
      shell: bash
      run: |
        echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH
