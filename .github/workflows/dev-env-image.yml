name: Dev Env Docker Image
on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'tools/docker/**'
      - '.github/workflows/dev-env-image.yml'
  push:
    branches:
      - master
      - develop
    paths:
      - 'tools/docker/**'
      - '.github/workflows/dev-env-image.yml'

permissions:
  contents: read

jobs:
  # Codefresh BuildingDockerImage step migration
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # pull_request の ref_name (e.g. 725/merge) は docker タグとして不正なので変換する
      - name: image tag
        id: image_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME//\//-}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tools/docker/Dockerfile
          tags: srzzumix/iutest_dev_env:${{ steps.image_tag.outputs.tag }}
          push: ${{ github.event_name == 'push' }}
