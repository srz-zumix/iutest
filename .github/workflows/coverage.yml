name: Coverage
on:
  pull_request:
    paths-ignore:
      - '.github/copilot-instructions.md'
      - '*.ini'
      - '*.md'
      - 'docs/**'
      - '*.yml'
      - '*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codecov:
    runs-on: ubuntu-latest
    # jobs.*.if では env 参照できない
    # act の場合 github.ref_protected がないのでそれを利用
    # act では実行しない
    if: github.ref_protected != null
    env:
      USE_COVERAGE: gcov
      DEFS: -DIUTEST_FORCE_COLORCONSOLE=1
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: info
      run: |
        make -C test showcxxmacros
        make -C test showcxxversion
        make -C test check_stdlib
    - name: specs
      run: |
        make -C test minimum_tests && ./test/minimum_tests --spec --feature
        make -C test clean
    - name: build
      run: |
        make -C test -j4 default
    - name: test
      run: |
        make -C test test
    - uses: actions/upload-artifact@v7
      with:
        name: test-result
        path: test/*.xml
    - name: coverage
      run: |
        make -C test coverage
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        fail_ci_if_error: true
        verbose: true

  coveralls:
    runs-on: ubuntu-latest
    # jobs.*.if では env 参照できない
    # act の場合 github.ref_protected がないのでそれを利用
    # act では実行しない
    if: github.ref_protected != null
    env:
      USE_COVERAGE: lcov
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: install dependencies
      run: |
        sudo apt-get install -qq -y lcov
    - name: info
      run: |
        make -C test showcxxmacros
        make -C test showcxxversion
        make -C test check_stdlib
    - name: specs
      run: |
        make -C test minimum_tests && ./test/minimum_tests --spec --feature
        make -C test clean
    - name: build
      run: |
        make -C test -j4 default
    - name: test
      run: |
        make -C test test
    - uses: actions/upload-artifact@v7
      with:
        name: test-result
        path: test/*.xml
    - name: coverage
      run: |
        make -C test coverage
    - name: Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: test/coverage.info
