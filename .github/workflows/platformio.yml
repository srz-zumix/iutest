name: PlatformIO ESP Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp8266, esp32]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Compile and link Arduino smoke test
        env:
          PIO_ENV: ${{ matrix.target }}
        run: pio run --project-dir test/platformio --environment "$PIO_ENV"
